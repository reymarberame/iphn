<VirtualHost *:8080>
    ServerName _
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Reverb WebSockets share the application's public HTTPS domain. Apache
    # proxies /app (the Pusher protocol path) to Reverb on localhost.
    ProxyPreserveHost On
    ProxyPass        /app  ws://127.0.0.1:8081/app
    ProxyPassReverse /app  ws://127.0.0.1:8081/app

    # Reverb's Pusher HTTP API lives at /apps (plural). Server-side broadcasters
    # (for example a Laravel app on Vercel) POST events through this path.
    ProxyPass        /apps http://127.0.0.1:8081/apps
    ProxyPassReverse /apps http://127.0.0.1:8081/apps

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
